# Backups of the cloud database (ADR-0019, docs/superpowers/specs/2026-10-21-db-backups-design.md): a copy every
# day at BACKUP_TIME (Asia/Dushanbe), each verified by a restore into a scratch instance, kept
# BACKUP_RETENTION_DAYS days in BACKUP_DIR on the host. test and prod only: the stack script adds this file
#   npm run stack -- <test|prod> <backup|backup-status|backup-verify|restore>
# BACKUP_DIR must be a separate disk or a network volume, writable by uid 70 (postgres in the image).

services:
  postgres:
    environment:
      # 04-backup-role.sql creates the role pharmacy_backup with this password (initdb and every `stack up`).
      PHARMACY_BACKUP_PASSWORD: ${PHARMACY_BACKUP_PASSWORD:?set in the env file}
    volumes:
      # Read-only: `stack restore` runs pg_restore in this container over the local socket.
      - ${BACKUP_DIR:?set in the env file}:/backups:ro

  backup:
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    pull_policy: never
    user: postgres
    # Read-only, without capabilities and privilege escalation, as api and migrate (security review 2026-10-22, S3):
    # it writes only /backups, /scratch and the tmpfs /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # docker-init as PID 1 delivers SIGTERM to the daemon while it sleeps.
    init: true
    command: ['pharmacy-backup', 'daemon']
    environment:
      # Over the local socket shared with postgres (pg-socket): pharmacy_backup does not sign in over TCP (Z6).
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: pharmacy_backup
      PGPASSWORD: ${PHARMACY_BACKUP_PASSWORD:?set in the env file}
      PGDATABASE: ${POSTGRES_DB:-pharmacy}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: Asia/Dushanbe
      IMAGE_TAG: ${IMAGE_TAG:-local}
      # Copies off the host (ADR-0020, spec 2026-10-23-offsite-backups): encrypted with the public keys of the keepers
      # and uploaded with rclone under <APP_ENV>/ in the bucket; without a bucket nothing leaves the host (prod reports
      # it as unhealthy).
      APP_ENV: ${APP_ENV:?set in the env file}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_FORCE_PATH_STYLE: ${RCLONE_CONFIG_OFFSITE_FORCE_PATH_STYLE:-}
      # The root is read-only: rclone keeps its (empty) config file and its cache on the tmpfs.
      RCLONE_CONFIG: /tmp/rclone.conf
      RCLONE_CACHE_DIR: /tmp/rclone-cache
    volumes:
      - ${BACKUP_DIR:?set in the env file}:/backups
      - backup-scratch:/scratch
      # Read-only: this container runs as the uid of the server (postgres) and would otherwise own the directory and
      # could put its own socket in place of the server's (pg-socket of postgres).
      - pg-socket:/var/run/postgresql:ro
    shm_size: 256mb
    depends_on:
      postgres:
        condition: service_healthy
      # No copy runs beside the migrations of the same `up`: pg_dump holds its locks to the end (spec B12).
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Unhealthy without a verified copy for 26 h (after the first 2 h of the container) or when blocked.
      test: ['CMD', 'pharmacy-backup', 'health']
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 1m
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  backup-scratch:
