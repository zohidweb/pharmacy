# Pharmacy Redis — sessions and cache; persistence disabled (loss is acceptable, C4 deployment).
bind 0.0.0.0
protected-mode yes
save ""
appendonly no
# maxmemory is set per environment: REDIS_MAXMEMORY in docker/env/*.env (compose command)
maxmemory 256mb
# Only keys with a TTL (sessions, cache entries) may be evicted.
maxmemory-policy volatile-lru
