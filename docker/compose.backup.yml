# Backups of the cloud database (ADR-0019, docs/superpowers/specs/2026-10-21-db-backups-design.md): a copy every
# day at BACKUP_TIME (Asia/Dushanbe), each verified by a restore into a scratch instance, kept
# BACKUP_RETENTION_DAYS days in BACKUP_DIR on the host. test and prod only: the stack script adds this file
#   npm run stack -- <test|prod> <backup|backup-status|backup-verify|restore>
# BACKUP_DIR must be a separate disk or a network volume, writable by uid 70 (postgres in the image).

services:
  postgres:
    environment:
      # 04-backup-role.sql creates the role pharmacy_backup with this password (initdb and every `stack up`).
      PHARMACY_BACKUP_PASSWORD: ${PHARMACY_BACKUP_PASSWORD:?set in the env file}
    volumes:
      # Read-only: `stack restore` runs pg_restore in this container over the local socket.
      - ${BACKUP_DIR:?set in the env file}:/backups:ro

  backup:
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    user: postgres
    # docker-init as PID 1 delivers SIGTERM to the daemon while it sleeps.
    init: true
    command: ['pharmacy-backup', 'daemon']
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: pharmacy_backup
      PGPASSWORD: ${PHARMACY_BACKUP_PASSWORD:?set in the env file}
      PGDATABASE: ${POSTGRES_DB:-pharmacy}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: Asia/Dushanbe
      IMAGE_TAG: ${IMAGE_TAG:-local}
    volumes:
      - ${BACKUP_DIR:?set in the env file}:/backups
      - backup-scratch:/scratch
    shm_size: 256mb
    depends_on:
      postgres:
        condition: service_healthy
      # No copy runs beside the migrations of the same `up`: pg_dump holds its locks to the end (spec B12).
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Unhealthy without a verified copy for 26 h (after the first 2 h of the container) or when blocked.
      test: ['CMD', 'pharmacy-backup', 'health']
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 1m
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  backup-scratch:
