# Base stack shared by all environments (ADR-0005): PostgreSQL + Redis + API.
# Do not run this file alone — use the environment scripts (CLAUDE.md, "Environments"):
#   npm run stack -- <dev|test|prod> <up|down|ps|logs|build>
# Environment overrides: compose.dev.yml, compose.test.yml, compose.prod.yml.
# web/admin are built as static files; serving them comes with the reverse proxy (future ADR-0012).

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Containers of our code run read-only, without Linux capabilities and without privilege escalation (security review
# 2026-10-22, S3): code execution in them cannot rewrite the code or the binaries of the image; /tmp is a tmpfs.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    build: ./postgres
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in the env file}
      # psql in this container over the local socket (`stack up`, `restore`): in test and prod the socket needs a
      # password too (docker/postgres/pg_hba.conf).
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in the env file}
      PHARMACY_OWNER_PASSWORD: ${PHARMACY_OWNER_PASSWORD:?set in the env file}
      PHARMACY_APP_PASSWORD: ${PHARMACY_APP_PASSWORD:?set in the env file}
      PHARMACY_PLATFORM_PASSWORD: ${PHARMACY_PLATFORM_PASSWORD:?set in the env file}
      PHARMACY_TEST_DATABASE: ${PHARMACY_TEST_DATABASE:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # The local socket, shared with migrate and backup: their roles do not sign in over TCP in test and prod.
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    build: ./redis
    image: pharmacy/redis:${IMAGE_TAG:-local}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set in the env file}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # redis-server replaces its arguments with its process title; redis-cli does not, so the healthcheck gives it the
    # password by REDISCLI_AUTH, not `-a` — every 5 s it would show in `ps` on the host to every user
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot: applies SQL migrations as pharmacy_owner before the API starts (ADR-0006).
  # PHARMACY_OWNER_PASSWORD is passed to this service only - never to api.
  migrate:
    <<: *hardened
    image: pharmacy/api:${IMAGE_TAG:-local}
    command: ['node', 'scripts/migrate.mjs']
    environment:
      # Over the shared local socket (pg-socket): pharmacy_owner does not sign in over TCP in test and prod (Z6).
      MIGRATION_DATABASE_URL: postgres://pharmacy_owner:${PHARMACY_OWNER_PASSWORD:?set in the env file}@localhost/${POSTGRES_DB:-pharmacy}?host=/var/run/postgresql
    volumes:
      - pg-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: pharmacy/api:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?set in the env file}
      PORT: 3000
      DATABASE_URL: postgres://pharmacy_app:${PHARMACY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-pharmacy}
      PLATFORM_DATABASE_URL: postgres://pharmacy_platform:${PHARMACY_PLATFORM_PASSWORD}@postgres:5432/${POSTGRES_DB:-pharmacy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_JWT_KEYS: ${SESSION_JWT_KEYS:?set in the env file}
      SESSION_JWT_ACTIVE_KID: ${SESSION_JWT_ACTIVE_KID:?set in the env file}
      PASSWORD_PEPPERS: ${PASSWORD_PEPPERS:?set in the env file}
      PASSWORD_PEPPER_ACTIVE: ${PASSWORD_PEPPER_ACTIVE:?set in the env file}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in the env file}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set in the env file}
      AUTH_TEST_COOKIES: ${AUTH_TEST_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # The routes of the offline-store sync, off until the first offline store (security review 2026-10-22, 7.4).
      OFFLINE_SYNC_ENABLED: ${OFFLINE_SYNC_ENABLED:-false}
      # Optional sign-in settings: set in the env file to change them. The defaults repeat those of
      # apps/api/src/app/config/env.validation.ts and must stay in step with them.
      SESSION_IDLE_TIMEOUT_MIN_SECONDS: ${SESSION_IDLE_TIMEOUT_MIN_SECONDS:-300}
      SESSION_IDLE_TIMEOUT_MAX_SECONDS: ${SESSION_IDLE_TIMEOUT_MAX_SECONDS:-43200}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      STEP_UP_MAX_AGE_SECONDS: ${STEP_UP_MAX_AGE_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      LOGIN_FAILURE_FLOOR_MS: ${LOGIN_FAILURE_FLOOR_MS:-400}
      ACTIVATION_CODE_TTL_HOURS: ${ACTIVATION_CODE_TTL_HOURS:-72}
      TERMINAL_PIN_MAX_FAILURES: ${TERMINAL_PIN_MAX_FAILURES:-10}
      TERMINAL_PIN_WINDOW_SECONDS: ${TERMINAL_PIN_WINDOW_SECONDS:-900}
      OPERATOR_SESSION_IDLE_SECONDS: ${OPERATOR_SESSION_IDLE_SECONDS:-1800}
      OPERATOR_SESSION_ABSOLUTE_SECONDS: ${OPERATOR_SESSION_ABSOLUTE_SECONDS:-28800}
    ports:
      - '127.0.0.1:${API_PORT:?set in the env file}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

volumes:
  pg-data:
  pg-socket:
