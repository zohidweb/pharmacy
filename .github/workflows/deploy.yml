name: CI/CD

# checks: lint, FSD layers, typecheck, tests and build on every PR and every push to main.
# deploy: only after checks pass, only from main, never for pull requests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token by default (ADR-0009). Jobs that need more must ask for it.
permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A newer push to the same branch makes the older check run pointless.
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      NX_DAEMON: 'false'
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0 — Node version comes from .nvmrc (24), npm cache keyed by package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, FSD, typecheck, test, build
        run: npx nx run-many -t lint fsd typecheck test build

  deploy:
    name: deploy
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The "production" environment is created by GitHub on first use. Later you can add
    # "Required reviewers" to it (Settings -> Environments) to make every deploy wait for a click.
    environment: production
    # Never two deploys at once; a running deploy is not cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          # The commit that passed `checks` is the one that gets deployed.
          ssh -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" "bash -s $DEPLOY_SHA" <<'EOF'
          set -euo pipefail
          source ~/.nvm/nvm.sh
          cd /opt/pharmacy
          git fetch --prune origin
          git merge --ff-only "$1"
          nvm install "$(cat .nvmrc)"
          npm ci
          npm run prod:build
          npm run prod:up
          npm run stack -- prod ps
          EOF

      - name: Smoke test
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null https://app.nurmed.online/
          echo "app.nurmed.online answers"