# Base stack shared by all environments (ADR-0005): PostgreSQL + Redis + API.
# Do not run this file alone — use the environment scripts (CLAUDE.md, "Environments"):
#   npm run stack -- <dev|test|prod> <up|down|ps|logs|build>
# Environment overrides: compose.dev.yml, compose.test.yml, compose.prod.yml.
# web/admin are built as static files; serving them comes with ADR-0011 (reverse proxy).

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    build: ./postgres
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in the env file}
      PHARMACY_OWNER_PASSWORD: ${PHARMACY_OWNER_PASSWORD:?set in the env file}
      PHARMACY_APP_PASSWORD: ${PHARMACY_APP_PASSWORD:?set in the env file}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    build: ./redis
    image: pharmacy/redis:${IMAGE_TAG:-local}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set in the env file}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: pharmacy/api:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?set in the env file}
      PORT: 3000
      # Used once the data layer (ADR-0006) and sessions (ADR-0008) are implemented
      DATABASE_URL: postgres://pharmacy_app:${PHARMACY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-pharmacy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '127.0.0.1:${API_PORT:?set in the env file}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

volumes:
  pg-data:
