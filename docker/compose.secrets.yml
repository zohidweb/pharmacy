# Secrets of test and prod (ADR-0021, docs/superpowers/specs/2026-10-27-secret-store-design.md): one file per secret in
# SECRETS_DIR of the env file (relative to this directory: ./secrets/test, ./secrets/prod; the directory 0700, the
# files 0444, outside git). Each service gets only its own secrets, as files at /run/secrets/<name> and *_FILE
# variables — never as values in its environment or on a command line, so `docker inspect` and `docker compose config`
# show none. The stack script adds this file for test and prod, as compose.backup.yml.
# This file is the one place that says who gets what. Compose without Swarm ignores uid, gid and mode of a secret: the
# host decides them (the directory 0700 keeps other users of the host out; each service reads its mounted files).
# The files are made and checked by the tool service below — on a developer machine and on the VPS alike:
#   docker compose … --profile tools run --rm secrets init     (creates the missing ones, never overwrites)
#   docker compose … --profile tools run --rm secrets check

secrets:
  postgres_superuser_password:
    file: ${SECRETS_DIR:?set in the env file}/postgres_superuser_password
  pharmacy_owner_password:
    file: ${SECRETS_DIR:?set in the env file}/pharmacy_owner_password
  pharmacy_app_password:
    file: ${SECRETS_DIR:?set in the env file}/pharmacy_app_password
  pharmacy_platform_password:
    file: ${SECRETS_DIR:?set in the env file}/pharmacy_platform_password
  pharmacy_backup_password:
    file: ${SECRETS_DIR:?set in the env file}/pharmacy_backup_password
  redis_password:
    file: ${SECRETS_DIR:?set in the env file}/redis_password
  # `user default on #<SHA-256 of redis_password> …` — pharmacy-secrets rebuilds it from redis_password.
  redis_users_acl:
    file: ${SECRETS_DIR:?set in the env file}/redis_users_acl
  session_jwt_keys:
    file: ${SECRETS_DIR:?set in the env file}/session_jwt_keys
  password_peppers:
    file: ${SECRETS_DIR:?set in the env file}/password_peppers
  # The S3 key of the bucket of the copies off the host (ADR-0020); empty — nothing leaves the host.
  offsite_secret_access_key:
    file: ${SECRETS_DIR:?set in the env file}/offsite_secret_access_key

services:
  postgres:
    secrets:
      - postgres_superuser_password
      - pharmacy_owner_password
      - pharmacy_app_password
      - pharmacy_platform_password
      - pharmacy_backup_password
    environment:
      # Read by the entrypoint of the official image (initdb) and by pharmacy-psql (the superuser over the socket).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # initdb (01-roles.sh) creates the roles with these passwords; pharmacy-psql gives the backup one to
      # 04-backup-role.sql on every `stack up`.
      PHARMACY_OWNER_PASSWORD_FILE: /run/secrets/pharmacy_owner_password
      PHARMACY_APP_PASSWORD_FILE: /run/secrets/pharmacy_app_password
      PHARMACY_PLATFORM_PASSWORD_FILE: /run/secrets/pharmacy_platform_password
      PHARMACY_BACKUP_PASSWORD_FILE: /run/secrets/pharmacy_backup_password

  redis:
    secrets:
      - redis_users_acl
    # The ACL file instead of --requirepass: the container knows only the SHA-256 of the password, and no password is
    # among the arguments of the process.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --aclfile
      - /run/secrets/redis_users_acl
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}

  migrate:
    secrets:
      - pharmacy_owner_password
    environment:
      # The loader of the api image (apps/api/scripts/secret-files.mjs) runs before any code and puts the password from
      # *_PASSWORD_FILE into the matching *_URL; other *_FILE set their variable.
      NODE_OPTIONS: --import=/app/scripts/secret-files.mjs
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/pharmacy_owner_password

  api:
    secrets:
      - pharmacy_app_password
      - pharmacy_platform_password
      - redis_password
      - session_jwt_keys
      - password_peppers
    environment:
      NODE_OPTIONS: --import=/app/scripts/secret-files.mjs
      DATABASE_PASSWORD_FILE: /run/secrets/pharmacy_app_password
      PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/pharmacy_platform_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SESSION_JWT_KEYS_FILE: /run/secrets/session_jwt_keys
      PASSWORD_PEPPERS_FILE: /run/secrets/password_peppers

  backup:
    secrets:
      - pharmacy_backup_password
      - offsite_secret_access_key
    environment:
      # Read by pharmacy-backup when it starts.
      PGPASSWORD_FILE: /run/secrets/pharmacy_backup_password
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY_FILE: /run/secrets/offsite_secret_access_key

  # Creates and checks the secret files (pharmacy-secrets of the postgres image); started by hand only. No network,
  # read-only, and of the capabilities of root only those that write the files into a directory of another owner and
  # hand them over to that owner.
  secrets:
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    pull_policy: never
    profiles: ['tools']
    entrypoint: ['pharmacy-secrets']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ${SECRETS_DIR:?set in the env file}:/s
