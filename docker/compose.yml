# Base stack shared by all environments (ADR-0005): PostgreSQL + Redis + API + reverse proxy (ADR-0012).
# Do not run this file alone — use the environment scripts (CLAUDE.md, "Environments"):
#   npm run stack -- <dev|test|prod> <up|down|ps|logs|build>
# Environment overrides: compose.dev.yml, compose.test.yml, compose.prod.yml.
# web/admin are baked into the proxy image (Caddy, docker/proxy); in test/prod the API is reachable only through it
# (test also publishes it on 127.0.0.1 for diagnostics, dev — for the dockerized api).
# The proxy addresses and ports are required by the test/prod overrides, not here: dev runs no proxy.
# The pharmacy/* images are built locally, never pulled (pull_policy: never): a missing or mistyped IMAGE_TAG fails
# instead of fetching a same-named image from Docker Hub.
# No secrets here (ADR-0021): dev takes its passwords and keys from .env in compose.dev.yml; test and prod get them as
# files from SECRETS_DIR through compose.secrets.yml, which the stack script adds. The connection URLs below carry no
# password: the secret files loader of the api image puts it in.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Containers of our code run read-only, without Linux capabilities and without privilege escalation (security review
# 2026-10-22, S3): code execution in them cannot rewrite the code or the binaries of the image; /tmp is a tmpfs.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    build: ./postgres
    image: pharmacy/postgres:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      PHARMACY_TEST_DATABASE: ${PHARMACY_TEST_DATABASE:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # The local socket, shared with migrate and backup: their roles do not sign in over TCP in test and prod. Only this
      # container writes the directory; they mount it read-only and cannot put another socket in its place.
      - pg-socket:/var/run/postgresql
    healthcheck:
      # Over TCP and without a password: the temporary server of initdb listens on the socket only, so the service is
      # not healthy before the real server runs (migrate would reach it over the shared socket). The role is one TCP may
      # sign in as; asked for a password, pg_isready answers "accepting" and logs nothing.
      test: ['CMD-SHELL', 'PGPASSWORD= pg_isready -q -h 127.0.0.1 -U pharmacy_app -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    build: ./redis
    image: pharmacy/redis:${IMAGE_TAG:-local}
    pull_policy: never
    # The password: --requirepass in dev (compose.dev.yml), the ACL file with its SHA-256 in test and prod
    # (compose.secrets.yml); each override repeats the whole command.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
    # Without a password, the same in every environment: NOAUTH, like PONG, means the server answers (K6).
    healthcheck:
      test: ['CMD-SHELL', "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot: applies SQL migrations as pharmacy_owner before the API starts (ADR-0006).
  # The password of pharmacy_owner is given to this service only - never to api.
  migrate:
    <<: *hardened
    image: pharmacy/api:${IMAGE_TAG:-local}
    pull_policy: never
    command: ['node', 'scripts/migrate.mjs']
    environment:
      # Over the shared local socket (pg-socket): pharmacy_owner does not sign in over TCP in test and prod (Z6).
      MIGRATION_DATABASE_URL: postgres://pharmacy_owner@localhost/${POSTGRES_DB:-pharmacy}?host=/var/run/postgresql
    volumes:
      # Read-only: connect() to the socket works, replacing it does not (pg-socket of postgres).
      - pg-socket:/var/run/postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: pharmacy/api:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?set in the env file}
      PORT: 3000
      DATABASE_URL: postgres://pharmacy_app@postgres:5432/${POSTGRES_DB:-pharmacy}
      PLATFORM_DATABASE_URL: postgres://pharmacy_platform@postgres:5432/${POSTGRES_DB:-pharmacy}
      REDIS_URL: redis://redis:6379
      # The key rings themselves (SESSION_JWT_KEYS, PASSWORD_PEPPERS) are secrets; only the active ids are here.
      SESSION_JWT_ACTIVE_KID: ${SESSION_JWT_ACTIVE_KID:?set in the env file}
      PASSWORD_PEPPER_ACTIVE: ${PASSWORD_PEPPER_ACTIVE:?set in the env file}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in the env file}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set in the env file}
      AUTH_TEST_COOKIES: ${AUTH_TEST_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # The routes of the offline-store sync, off until the first offline store (security review 2026-10-22, 7.4).
      OFFLINE_SYNC_ENABLED: ${OFFLINE_SYNC_ENABLED:-false}
      # Optional sign-in settings: set in the env file to change them. The defaults repeat those of
      # apps/api/src/app/config/env.validation.ts and must stay in step with them.
      SESSION_IDLE_TIMEOUT_MIN_SECONDS: ${SESSION_IDLE_TIMEOUT_MIN_SECONDS:-300}
      SESSION_IDLE_TIMEOUT_MAX_SECONDS: ${SESSION_IDLE_TIMEOUT_MAX_SECONDS:-43200}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      STEP_UP_MAX_AGE_SECONDS: ${STEP_UP_MAX_AGE_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      LOGIN_FAILURE_FLOOR_MS: ${LOGIN_FAILURE_FLOOR_MS:-400}
      ACTIVATION_CODE_TTL_HOURS: ${ACTIVATION_CODE_TTL_HOURS:-72}
      TERMINAL_PIN_MAX_FAILURES: ${TERMINAL_PIN_MAX_FAILURES:-10}
      TERMINAL_PIN_WINDOW_SECONDS: ${TERMINAL_PIN_WINDOW_SECONDS:-900}
      OPERATOR_SESSION_IDLE_SECONDS: ${OPERATOR_SESSION_IDLE_SECONDS:-1800}
      OPERATOR_SESSION_ABSOLUTE_SECONDS: ${OPERATOR_SESSION_ABSOLUTE_SECONDS:-28800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # The single entry point (ADR-0012): TLS, static web/admin, /api to the API on the same origin.
  proxy:
    <<: *hardened
    # Caddy runs as root in its image: of the capabilities it keeps only binding 80 and 443.
    cap_add: [NET_BIND_SERVICE]
    build:
      context: ..
      dockerfile: docker/proxy/Dockerfile
    image: pharmacy/proxy:${IMAGE_TAG:-local}
    pull_policy: never
    volumes:
      # ACME account key, certificates, Caddy's local CA — must survive restarts (Let's Encrypt rate limits)
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  pg-data:
  pg-socket:
  proxy-data:
  proxy-config:
