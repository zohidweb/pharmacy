# Client authentication of test and prod (security review 2026-10-22, Z6): compose.test.yml and compose.prod.yml
# start PostgreSQL with -c hba_file=/etc/pharmacy/pg_hba.conf; dev keeps the default rules of the image.
# Over TCP only the runtime roles of the API sign in. The superuser, pharmacy_owner (service migrate) and
# pharmacy_backup (service backup) reach the server over the local socket only — the volume pg-socket shared by the
# postgres, migrate and backup containers, never by api. Every connection needs its password.
# TYPE  DATABASE  USER               ADDRESS  METHOD
local   all       all                         scram-sha-256
host    all       pharmacy_app       all      scram-sha-256
host    all       pharmacy_platform  all      scram-sha-256
